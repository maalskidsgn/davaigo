<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Davaigo – Russisch lernen mit echten Videos</title>
    <meta
      name="description"
      content="Lerne Russisch mit YouTube-Videos, geführten Lektionen und einem Vokabeltrainer, der sich merkt, wann du wiederholen musst. Kostenlos starten."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Farbe der Browserleiste auf dem Handy -->
    <meta name="theme-color" content="#7c3aed" />

    <!-- Auf dem Startbildschirm gespeichert: eigenes Fenster ohne
         Browserleiste, und unter dem Symbol steht "Davaigo" statt des
         langen Seitentitels. Apple braucht dafür bis heute eigene
         Zeilen, das Manifest allein genügt auf iOS nicht. -->
    <meta name="apple-mobile-web-app-title" content="Davaigo" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Vorschau beim Teilen in Chats und sozialen Netzwerken -->
    <meta property="og:title" content="Davaigo – Russisch lernen mit echten Videos" />
    <meta
      property="og:description"
      content="Videos mit mitlaufenden Untertiteln, Vokabeltrainer mit Gedächtnis und Lektionen vom ersten „Привет“ an."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://davaigo.de/" />
    <meta property="og:locale" content="de_DE" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
